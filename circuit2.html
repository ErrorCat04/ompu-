<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  body{margin:0}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;background:#f4f4f4}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
const cv = document.getElementById("scene");
const ctx = cv.getContext("2d");
cv.width = innerWidth; cv.height = innerHeight;

// DATA
const parts = [
  {x:80,  y:150, w:60, h:40, name:"SW"},
  {x:220, y:150, w:60, h:40, name:"NOT"},
  {x:360, y:150, w:60, h:40, name:"LAMP"}
];
const view = {x:0, y:0, s:1};   // pan x/y and zoom scale
const pts = new Map();          // fingers touching the screen
let drag = null, lastDist = 0;

function toWorld(px,py){
  return {x:(px-view.x)/view.s, y:(py-view.y)/view.s};
}

// DRAW
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(view.s,0,0,view.s,view.x,view.y);
  ctx.strokeStyle="#000"; ctx.lineWidth=2;
  for(let i=0;i<parts.length-1;i++){
    const a=parts[i], b=parts[i+1];
    ctx.beginPath();
    ctx.moveTo(a.x+a.w, a.y+a.h/2);
    ctx.lineTo(b.x, b.y+b.h/2);
    ctx.stroke();
  }
  parts.forEach(p=>{
    ctx.fillStyle="#69c"; ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#000"; ctx.font="14px sans-serif";
    ctx.fillText(p.name, p.x+8, p.y+25);
  });
}

// FINGER DOWN
cv.addEventListener("pointerdown", e=>{
  cv.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size==1){
    const w = toWorld(e.clientX,e.clientY);
    drag = parts.find(p=>w.x>=p.x && w.x<=p.x+p.w && w.y>=p.y && w.y<=p.y+p.h) || "pan";
  } else {
    drag = null; lastDist = dist();
  }
});

// FINGER MOVE
cv.addEventListener("pointermove", e=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pts.size==1){
    if(drag==="pan"){ view.x+=dx; view.y+=dy; }
    else if(drag){ drag.x+=dx/view.s; drag.y+=dy/view.s; }
  } else if(pts.size==2){
    const d=dist(), c=center(), k=d/lastDist;
    view.x = c.x-(c.x-view.x)*k;
    view.y = c.y-(c.y-view.y)*k;
    view.s *= k;
    lastDist = d;
  }
  draw();
});

// FINGER UP
function end(e){ pts.delete(e.pointerId); drag=null; lastDist=0; }
cv.addEventListener("pointerup", end);
cv.addEventListener("pointercancel", end);

// HELPERS
function dist(){ const [a,b]=[...pts.values()]; return Math.hypot(a.x-b.x,a.y-b.y); }
function center(){ const [a,b]=[...pts.values()]; return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

draw();
</script>
</body>
</html>
